[project]
name = "wavecast"
version = "0.1.0"
description = "Wavelet-Shapelet Financial Forecasting Library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "musicofhel" }]
keywords = ["wavelets", "shapelets", "forecasting", "finance", "dtw", "fractal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyWavelets>=1.7",
    "dtaidistance>=2.3",
    "MFDFA>=0.4",
    "stumpy>=1.13",
    "xgboost>=2.0",
    "torch>=2.0",
    "scikit-learn>=1.5",
    "massive>=2.0",
    "h5py>=3.10",
    "pandas>=2.2",
    "numpy>=2.0",
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "optuna>=3.6",
    "matplotlib>=3.9",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
wavecast = "wavecast.cli.app:app"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "wavecast._wavecast_rs"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N803",   # argument name should be lowercase (X, H are standard in math)
    "N806",   # variable name should be lowercase (same)
    "N811",   # constant imported as non-constant
    "B008",   # function call in default arg (typer.Option/Argument by design)
    "TCH",    # type-checking imports (cosmetic, not worth the churn)
]

[tool.ruff.lint.per-file-ignores]
"dashboard/pages/*.py" = ["N999", "E402"]  # Streamlit multipage: numeric-prefix filenames + sys.path before imports
"dashboard/app.py" = ["E402"]  # sys.path must come before dashboard imports

[tool.ruff.lint.isort]
known-first-party = ["wavecast"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pywt.*",
    "dtaidistance.*",
    "MFDFA.*",
    "stumpy.*",
    "xgboost.*",
    "torch.*",
    "h5py.*",
    "optuna.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
